name: Nightly

# The Steam games download their dedicated servers on start: Valheim (~1 GB),
# Eco (~500 MB) and Project Zomboid (~3 GB) run on a hosted runner every night. CS2 (~60 GB) does not
# fit a hosted runner's disk, so it only runs when the CS2_RUNNER repository
# variable names a self-hosted runner label with the space for it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valheim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - run: docker buildx bake valheim --set '*.platform=linux/amd64' --set 'valheim.tags=dk-smoke:valheim' --load
      - run: bash images/valheim/test/smoke.sh dk-smoke:valheim

  eco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - run: docker buildx bake eco --set '*.platform=linux/amd64' --set 'eco.tags=dk-smoke:eco' --load
      - run: bash images/eco/test/smoke.sh dk-smoke:eco

  project-zomboid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - run: docker buildx bake project-zomboid --set '*.platform=linux/amd64' --set 'project-zomboid.tags=dk-smoke:project-zomboid' --load
      - run: bash images/project-zomboid/test/smoke.sh dk-smoke:project-zomboid

  cs2:
    if: vars.CS2_RUNNER != ''
    runs-on: ${{ vars.CS2_RUNNER }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - run: docker buildx bake cs2 --set '*.platform=linux/amd64' --set 'cs2.tags=dk-smoke:cs2' --load
      - run: bash images/cs2/test/smoke.sh dk-smoke:cs2
