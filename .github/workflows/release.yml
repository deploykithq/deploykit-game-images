name: Release

# release-please keeps one release PR for every component with unreleased
# conventional commits. Merging it tags the releases; the publish job then
# builds, pushes and signs exactly the images whose component was released
# (a supervisor or base release republishes all of them).
#
# workflow_dispatch republishes components by hand, e.g. "all" after a base
# image (debian, temurin) security update. The weekly schedule does exactly
# that, so OS and runtime patches reach the images without a release.

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      components:
        description: "Space-separated: all, supervisor, base, terraria, minecraft-java, tmodloader, valheim, cs2, eco, project-zomboid"
        required: true
        default: all

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths: ${{ steps.rp.outputs.paths_released }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       (needs.release-please.result == 'success' && needs.release-please.outputs.paths != '[]' && needs.release-please.outputs.paths != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: components
        id: comp
        env:
          PATHS: ${{ needs.release-please.outputs.paths }}
          MANUAL: ${{ github.event_name == 'schedule' && 'all' || inputs.components }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "list=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            # "images/terraria" -> terraria, "base" -> base, "supervisor" -> supervisor
            echo "list=$(jq -r '.[] | sub("^images/"; "")' <<<"$PATHS" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        env:
          LIST: ${{ steps.comp.outputs.list }}
        # Word-splitting LIST is intended; publish.sh rejects unknown names.
        run: bash scripts/publish.sh $LIST
