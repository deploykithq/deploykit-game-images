name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervisor:
    name: Supervisor (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supervisor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: supervisor/go.mod
          cache-dependency-path: supervisor/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: Lint (shellcheck, hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck -x -S warning -e SC1091 \
            images/*/hooks/*.sh images/*/test/*.sh scripts/*.sh \
            base/rootfs/opt/deploykit/*.sh base/rootfs/opt/deploykit/lib/*.sh base/steamcmd/*.sh
      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD:/w" -w /w hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 \
            hadolint --failure-threshold warning base/Dockerfile base/steamcmd/Dockerfile images/*/Dockerfile

  build:
    name: Build all (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: bake
        run: docker buildx bake --set '*.platform=linux/amd64'

  scan:
    name: Scan bases (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker
      - name: build
        run: docker buildx bake base-debian base-java25 base-steamcmd --set '*.platform=linux/amd64' --set 'base-debian.tags=dk-scan:debian' --set 'base-java25.tags=dk-scan:java25' --set 'base-steamcmd.tags=dk-scan:steamcmd' --load
      # Every game image is one of these plus a few apt packages: a fixable
      # HIGH or CRITICAL here is one in every image built on it.
      - name: trivy
        run: |
          for img in dk-scan:debian dk-scan:java25 dk-scan:steamcmd; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$img"
          done

  smoke:
    name: Smoke ${{ matrix.game }}
    needs: [supervisor]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: terraria
            target: terraria
          - game: minecraft-java
            target: minecraft-java25
          - game: tmodloader
            target: tmodloader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker
      - name: build
        run: |
          docker buildx bake ${{ matrix.target }} \
            --set '*.platform=linux/amd64' --set '${{ matrix.target }}.tags=dk-smoke:${{ matrix.game }}' --load
      - name: smoke
        env:
          # Runners share IPs, which exhaust GitHub's anonymous API limit
          # (tModLoader looks up its release digest there).
          DK_GITHUB_TOKEN: ${{ github.token }}
        run: bash images/${{ matrix.game }}/test/smoke.sh dk-smoke:${{ matrix.game }}
